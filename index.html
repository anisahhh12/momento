<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Photo Booth - Majlis</title>
    <style>
        :root {
            --primary-color: #800020; /* Burgundy / Maroon wedding theme */
            --accent-color: #d4af37;  /* Gold accent */
            --bg-color: #f9f9f9;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            width: 100%;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .camera-box {
            position: relative;
            width: 100%;
            height: 360px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
        }

        #countdown {
            position: absolute;
            font-size: 5rem;
            color: white;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
            z-index: 10;
            display: none;
        }

        .controls {
            margin-top: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button.secondary {
            background-color: #666;
        }

        .options-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
        }

        select {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <header>
        <h1>Majlis Perkahwinan Photo Booth 📷</h1>
    </header>

    <div class="container">
        
        <div class="options-panel">
            <select id="layoutSelect">
                <option value="single">Single Shot</option>
            </select>
        </div>

        <div class="camera-box" id="cameraBox">
            <div id="countdown">3</div>
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="captureCanvas" style="display:none;"></canvas>
        </div>

        <div class="controls">
            <button id="snapButton" onclick="startCountdown()">Snap Photo! 📸</button>
            <div class="btn-group" id="actionButtons" style="display:none;">
                <button class="secondary" onclick="retakePhoto()">Retake</button>
                <button onclick="uploadPhoto()">Save & Upload 🚀</button>
            </div>
        </div>

    </div>

    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('captureCanvas');
        const countdownEl = document.getElementById('countdown');
        const snapBtn = document.getElementById('snapButton');
        const actionBtns = document.getElementById('actionButtons');

        let currentImageData = null;

        // 1. Initialize Camera
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' }, 
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Camera access error:", err);
                alert("Please allow camera permissions to use the photo booth!");
            }
        }
        initCamera();

        // 2. Countdown Timer
        function startCountdown() {
            let count = 3;
            countdownEl.style.display = 'block';
            countdownEl.innerText = count;
            snapBtn.style.display = 'none';

            let timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.innerText = count;
                } else {
                    clearInterval(timer);
                    countdownEl.style.display = 'none';
                    takeSnapshot();
                }
            }, 1000);
        }

        // 3. Take Snapshot
        function takeSnapshot() {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            currentImageData = canvas.toDataURL('image/png');
            video.style.display = 'none';
            actionBtns.style.display = 'flex';
        }

        // 4. Retake
        function retakePhoto() {
            video.style.display = 'block';
            actionBtns.style.display = 'none';
            snapBtn.style.display = 'block';
            currentImageData = null;
        }

        // 5. Upload to Google Drive via Apps Script Endpoint
        function uploadPhoto() {
            if (!currentImageData) return;

            // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW:
            const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

            alert("Uploading your photo to Google Drive... Please wait!");

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ image: currentImageData })
            })
            .then(response => response.json())
            .then(data => {
                alert("Success! Photo uploaded to the wedding album folder! 💍✨");
                retakePhoto();
            })
            .catch(error => {
                console.error('Upload Error:', error);
                alert("Upload failed, saving directly to your phone instead!");
                let link = document.createElement('a');
                link.download = 'majlis-photo.png';
                link.href = currentImageData;
                link.click();
                retakePhoto();
            });
        }
    </script>
</body>
</html>
